---
policies:
  - name: Local Updatecli Website Policies
    config:
      - updatecli/updatecli.d/
    values:
      - updatecli/values.d/scm.yaml

  - name: Update Updatecli policies
    policy: ghcr.io/updatecli/policies/updatecli/autodiscovery:0.9.0@sha256:67026697434a99f6e01a662caa662e8ed02e39e8abf8f7399ab673d113abb360
    values:
      - updatecli/values.d/scm.yaml

  - name: Golang Version
    policy: ghcr.io/updatecli/policies/golang/version:0.9.0@sha256:4ebf4c09d559ba1dcdd64b6f5749b4e0d7e473adef2f4805f85bc1a0f0795aa6
    values:
      - updatecli/values.d/scm.yaml

  - name: Minor Golang Module update
    policy: ghcr.io/updatecli/policies/autodiscovery/golang:0.14.0@sha256:dcca03ce07083bd34140d85ad2e1317ef6f40ea258f2b3c67edf3823a25d303f
    values:
      - updatecli/values.d/scm.yaml
      - updatecli/values.d/golang_minor.yaml

  - name: Patch Golang Module update
    policy: ghcr.io/updatecli/policies/autodiscovery/golang:0.14.0@sha256:dcca03ce07083bd34140d85ad2e1317ef6f40ea258f2b3c67edf3823a25d303f
    values:
      - updatecli/values.d/scm.yaml
      - updatecli/values.d/golang_patch.yaml

  - name: Update Dockerfilell update
    policy: ghcr.io/updatecli/policies/autodiscovery/dockerfile:0.10.0@sha256:f43897fa3352cffb268c2a60790368b521e318ea32305d2c450aa941b598ea3a
    values:
      - updatecli/values.d/scm.yaml

  - name: Update golangci-lint
    policy: ghcr.io/updatecli/policies/golangci-lint/githubaction:0.9.0@sha256:caccf9fe8fd42ffb113bf949cdf00f0bace80df1e59eadbd3cfcfbbfe5271161
    values:
      - updatecli/values.d/scm.yaml

  - name: Sync Updatecli values files from github.com/updatecli/updatecli
    policy: ghcr.io/updatecli/policies/file:0.3.4@sha256:52562d8f76f8148ac82146ebed48ad75c85408537a6187543179201a65ab7db5
    values:
      - updatecli/values.d/scm.yaml
      - updatecli/values.d/sync.yaml

  - name: Update githubactions
    policy: ghcr.io/updatecli/policies/autodiscovery/githubaction:0.4.1@sha256:869b676074f9fee7edd5d488140a12c3b09a5f8a175f12f26ea85a4f8bd0a9d1
    values:
      - updatecli/values.d/scm.yaml
      - updatecli/values.d/githubaction.yaml

  - name: Handle Updatecli version in GitHub action
    policy: ghcr.io/updatecli/policies/updatecli/githubaction:0.9.1@sha256:49c07d724474ff7976f7ad5ecb0db9aa46448b456d08f82717913b403a0f02d8
    values:
      - updatecli/values.d/scm.yaml

  - name: Update Updatecli version in GitHub action
    policy: ghcr.io/updatecli/policies/updatecli/githubaction:0.9.1@sha256:49c07d724474ff7976f7ad5ecb0db9aa46448b456d08f82717913b403a0f02d8
    values:
      - updatecli/values.d/scm.yaml
      - updatecli/values.d/githubaction.yaml

  - name: Configure Updatecli workflows
    id: updatecli
    policy: ghcr.io/updatecli/policies/updatecli/githubaction/scaffold:0.1.1@sha256:121dfef5a33bc5cad4eced09ae1fd2305319ce2fd6d23ff661b5c99d11d0d9d2
    valuesinline:
      gha:
        golang:
          enabled: true
        udash:
          enabled: true
        update:
          cron: "0 3 * * *"
          matrix:
            - target_name: "existing pipelines"
              apply_args: "--existing-only=true"
            - target_name: "monitored pipelines"
              apply_args: "--labels=monitor:active"
      pipeline:
        labels:
          ecosystem: "updatecli"
          policy: scaffold
          monitor: active
