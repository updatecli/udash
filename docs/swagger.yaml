definitions:
  condition.Config:
    properties:
      dependsOn:
        description: |-
          "dependson" allows to specify the order of execution of resources.
          It accepts a list of rules like "(resourceType#)resourceId(:booleanOperator)".

          The resourceType is optional and can be one of "condition", "source" or "target"
          By default the resourceType is the current resource type

          The resourceId is the name of the resource to depend on

          The booleanOperator is optional and can be "AND" or "OR"

          examples:
             dependson:
               * condition#myCondition:and
               * source#mySource

          remarks:
           * The parameters "sourceid" and "conditionsids" affect the order of resource execution.
           * To avoid circular dependencies, the depended resource may need to remove any conditionids or set "disablesourceinput to true".
        items:
          type: string
        type: array
      deprecatedDependsOn:
        description: |-
          !deprecated, please use dependson
          DeprecatedDependsOn is kept for backward compatibility
        items:
          type: string
        type: array
      deprecatedSCMID:
        description: |-
          !deprecated, please use scmid
          DeprecatedSCMID is kept for backward compatibility
        type: string
      deprecatedSourceID:
        description: '! Deprecated in favor of sourceID'
        type: string
      disableSourceInput:
        description: disablesourceinput disable the mechanism to retrieve a default
          value from a source.
        type: boolean
      failWhen:
        description: FailWhen allows to reverse a condition expected result from true
          to false.
        type: boolean
      kind:
        description: kind specifies the resource kind which defines accepted spec
          value
        type: string
      name:
        description: name specifies the resource name
        type: string
      scmid:
        description: scmid specifies the scm configuration key associated to the current
          resource
        type: string
      sourceID:
        description: sourceid specifies which "source", based on its ID, is used to
          retrieve the default value.
        type: string
      spec:
        description: spec specifies parameters for a specific resource kind
      transformers:
        description: transformers defines how the default input value need to be transformed
        items:
          $ref: '#/definitions/transformer.Transformer'
        type: array
    type: object
  database.ReportResultSummaryEntry:
    properties:
      date:
        description: Date is the start of the bucket, in UTC, formatted as RFC3339.
        type: string
      open_actions:
        additionalProperties:
          type: integer
        description: |-
          OpenActions contains, for each Updatecli result, how many of the reports counted in
          Results also carry an open action, such as a pull request still waiting to be merged.
          It is a breakdown of Results, not an addition to it, so its counts are always lower
          than or equal to the matching ones in Results.

          The interesting one is the count reported under the success result: those pipelines
          ran fine and had nothing to change only because the change is already waiting in a
          pull request.
        type: object
      results:
        additionalProperties:
          type: integer
        description: Results contains the number of reports per Updatecli result for
          that bucket.
        type: object
      total:
        description: Total is the number of reports for that bucket, all results combined.
        type: integer
    type: object
  database.SearchLatestReportData:
    properties:
      conditionConfigIDs:
        allOf:
        - $ref: '#/definitions/pgtype.Hstore'
        description: ConditionConfigIDs contains the config condition IDs associated
          with the report.
      createdAt:
        description: CreatedAt represents the creation date of the report.
        type: string
      filteredResourceID:
        description: |-
          FilteredResourceID contains the resource config ID that was filtered
          It allows to identify in the report which resource was used to filter the report.
        type: string
      id:
        description: ID represents the unique identifier of the report.
        type: string
      name:
        description: Name represents the name of the report.
        type: string
      report:
        allOf:
        - $ref: '#/definitions/reports.Report'
        description: Report contains the report data.
      result:
        description: Result represents the result of the report.
        type: string
      sourceConfigIDs:
        allOf:
        - $ref: '#/definitions/pgtype.Hstore'
        description: SourceConfigIDs contains the config source IDs associated with
          the report.
      targetConfigIDs:
        allOf:
        - $ref: '#/definitions/pgtype.Hstore'
        description: TargetConfigIDs contains the config target IDs associated with
          the report.
      updatedAt:
        description: UpdatedAt represents the last update date of the report.
        type: string
    type: object
  model.ConfigCondition:
    properties:
      config:
        $ref: '#/definitions/condition.Config'
      created_at:
        description: Created_at represent the creation date of the record.
        type: string
      id:
        description: ID is the unique identifier of the record in the database.
        type: string
      kind:
        description: Kind represent the kind of the resource configuration.
        type: string
      updated_at:
        description: Updated_at represent the last update date of the record.
        type: string
    type: object
  model.ConfigSource:
    properties:
      config:
        allOf:
        - $ref: '#/definitions/source.Config'
        description: Config is the configuration of the source resource.
      created_at:
        description: Created_at represent the creation date of the record.
        type: string
      id:
        description: ID is the unique identifier of the record in the database.
        type: string
      kind:
        description: Kind represent the kind of the resource configuration.
        type: string
      updated_at:
        description: Updated_at represent the last update date of the record.
        type: string
    type: object
  model.ConfigTarget:
    properties:
      config:
        $ref: '#/definitions/target.Config'
      created_at:
        description: Created_at represent the creation date of the record.
        type: string
      id:
        description: ID is the unique identifier of the record in the database.
        type: string
      kind:
        description: Kind represent the kind of the resource configuration.
        type: string
      updated_at:
        description: Updated_at represent the last update date of the record.
        type: string
    type: object
  model.Label:
    properties:
      created_at:
        description: CreatedAt is the time the label was created
        type: string
      id:
        description: ID is a unique identifier for the label, generated as a UUID.
        type: string
      key:
        description: Key is the label name
        type: string
      last_pipeline_report_at:
        description: LastPipelineReportAt is the time the label was last used in a
          pipeline report
        type: string
      updated_at:
        description: UpdatedAt is the time the label was last updated
        type: string
      value:
        description: Value is the value associated with the label
        type: string
    type: object
  model.PipelineReport:
    properties:
      conditionConfigIDs:
        allOf:
        - $ref: '#/definitions/pgtype.Hstore'
        description: ConditionConfigIDs is a list of unique identifiers of the condition
          configuration associated with the database.
      created_at:
        description: Create_at represent the creation date of the record.
        type: string
      id:
        description: ID is the unique identifier of the record in the database.
        type: string
      labelIDs:
        description: LabelIDs is a list of unique identifiers of the labels associated
          with the database.
        items:
          type: string
        type: array
      pipeline:
        allOf:
        - $ref: '#/definitions/reports.Report'
        description: Pipeline represent the Updatecli pipeline report.
      pipelineID:
        description: |-
          PipelineID represent the unique identifier of the pipeline.
          Several reports can be associated to the same PipelineID.
        type: string
      reportID:
        description: |-
          ReportID represent the ID of the pipeline executed by Updatecli.
          different execution of the same pipeline will have the same ReportID.
          This value is coming from the pipeline report to improve the search of reports.
        type: string
      result:
        description: Result represent the result of the pipeline execution.
        type: string
      sourceConfigIDs:
        allOf:
        - $ref: '#/definitions/pgtype.Hstore'
        description: SourceConfigIDs is a list of unique identifiers of the source
          configuration associated with the database.
      targetConfigIDs:
        allOf:
        - $ref: '#/definitions/pgtype.Hstore'
        description: TargetConfigIDs is a list of unique identifiers of the target
          configuration associated with the database.
      targetScmIDs:
        description: TargetScmIDs is a list of unique identifiers of the scm configuration
          associated with the database.
        items:
          type: string
        type: array
      updated_at:
        description: Updated_at represent the last update date of the record.
        type: string
    type: object
  model.SCM:
    properties:
      branch:
        description: Branch is the Git branch
        type: string
      created_at:
        description: Created_at is the time the SCM configuration was created
        type: string
      id:
        description: ID is a unique identifier for the SCM configuration
        type: string
      updated_at:
        description: Updated_at is the time the SCM configuration was last updated
        type: string
      url:
        description: URL is the Git repository URL
        type: string
    type: object
  pgtype.Hstore:
    additionalProperties:
      type: string
    type: object
  reports.Action:
    properties:
      actionUrl:
        description: Link is the URL of the action
        type: string
      description:
        description: Description is the description of the action
        type: string
      id:
        description: ID is the unique identifier of the action
        type: string
      pipelineTitle:
        description: PipelineTitle is the title of the pipeline
        type: string
      pipelineURL:
        allOf:
        - $ref: '#/definitions/reports.PipelineURL'
        description: using a pointer to avoid empty tag
      targets:
        description: Targets is the list of targets IDs associated with the action
        items:
          $ref: '#/definitions/reports.ActionTarget'
        type: array
      title:
        description: Title is the title of the action
        type: string
    type: object
  reports.ActionTarget:
    properties:
      changelogs:
        items:
          $ref: '#/definitions/reports.ActionTargetChangelog'
        type: array
      description:
        type: string
      id:
        type: string
      title:
        type: string
    type: object
  reports.ActionTargetChangelog:
    properties:
      description:
        description: Description is the description of the changelog
        type: string
      title:
        description: Title is the title of the changelog
        type: string
    type: object
  reports.CIData:
    properties:
      name:
        type: string
      url:
        type: string
    type: object
  reports.PipelineURL:
    properties:
      name:
        description: Name is the name of the pipeline
        type: string
      url:
        description: URL is the URL of the pipeline
        type: string
    type: object
  reports.Report:
    properties:
      actions:
        additionalProperties:
          $ref: '#/definitions/reports.Action'
        type: object
      ci:
        $ref: '#/definitions/reports.CIData'
      conditions:
        additionalProperties:
          $ref: '#/definitions/result.Condition'
        type: object
      err:
        type: string
      graph:
        type: string
      id:
        description: ID defines the report ID
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      pipelineID:
        description: PipelineID represents the Updatecli manifest pipelineID
        type: string
      reportURL:
        type: string
      result:
        type: string
      sources:
        additionalProperties:
          $ref: '#/definitions/result.Source'
        type: object
      targets:
        additionalProperties:
          $ref: '#/definitions/result.Target'
        type: object
    type: object
  result.Changelog:
    properties:
      body:
        description: Body represents the body of the changelog.
        type: string
      publishedAt:
        description: PublishedAt represents the date the changelog was published.
        type: string
      title:
        description: Title represents the title of the changelog. Typically a version
          number.
        type: string
      url:
        description: URL represents the URL to the changelog.
        type: string
    type: object
  result.Condition:
    properties:
      config:
        description: Config stores the source configuration
      consoleOutput:
        description: ConsoleOutput stores the console output of the condition execution
        type: string
      description:
        description: Description stores the condition execution description.
        type: string
      id:
        description: ID contains a uniq identifier for the condition
        type: string
      name:
        description: Name holds the condition name
        type: string
      pass:
        description: Pass stores the information detected by the condition execution.
        type: boolean
      result:
        description: "Result holds the condition result, accepted values must be one:\n\t\t\t*
          \"SUCCESS\"\n\t\t\t* \"FAILURE\"\n\t\t\t* \"ATTENTION\"\n\t\t\t* \"SKIPPED\""
        type: string
      scm:
        allOf:
        - $ref: '#/definitions/result.SCM'
        description: Scm stores scm information
      sourceID:
        description: SourceID stores the source ID used by the condition
        type: string
    type: object
  result.GitBranch:
    properties:
      source:
        description: Source defines the branch used as a source
        type: string
      target:
        description: Target defines the branch used by Updatecli to apply the changes
          done from the working branch
        type: string
      working:
        description: Working defines the working branch used by Updatecli
        type: string
    type: object
  result.SCM:
    properties:
      branch:
        allOf:
        - $ref: '#/definitions/result.GitBranch'
        description: Branch defines the different branches used by Updatecli
      branchReset:
        description: BranchReset defines if the scm branch was reset to the base branch
          during the pipeline execution
        type: boolean
      id:
        description: ID contains a uniq identifier for the scm
        type: string
      url:
        description: URL defines the git URL
        type: string
    type: object
  result.Source:
    properties:
      config:
        description: Config stores the source configuration
      consoleOutput:
        description: ConsoleOutput stores the console output of the source execution
        type: string
      description:
        description: Description stores the source execution description
        type: string
      id:
        description: ID contains a uniq identifier for the source
        type: string
      information:
        description: Information stores the information detected by the source execution
          such as a version
        type: string
      name:
        description: Name holds the source name
        type: string
      result:
        description: "Result holds the source result, accepted values must be one:\n\t\t\t*
          \"SUCCESS\"\n\t\t\t* \"FAILURE\"\n\t\t\t* \"ATTENTION\"\n\t\t\t* \"SKIPPED\""
        type: string
      scm:
        allOf:
        - $ref: '#/definitions/result.SCM'
        description: Scm stores scm information
    type: object
  result.Target:
    properties:
      changed:
        description: Changed specifies if the target was modify during the pipeline
          execution
        type: boolean
      changelogs:
        description: Changelogs holds the changelog description
        items:
          $ref: '#/definitions/result.Changelog'
        type: array
      config:
        description: Config stores the source configuration
      consoleOutput:
        description: ConsoleOutput stores the console output of the target execution
        type: string
      description:
        description: Description stores the target execution description
        type: string
      dryRun:
        description: DryRun defines if a target was executed in DryRun mode
        type: boolean
      files:
        description: Files holds the list of files modified by a target execution
        items:
          type: string
        type: array
      id:
        description: ID contains a uniq identifier for the target
        type: string
      information:
        description: Information stores the old information detected by the target
          execution
        type: string
      name:
        description: Name holds the target name
        type: string
      newInformation:
        description: NewInformation stores the new information updated by during the
          target execution
        type: string
      result:
        description: "Result holds the target result, accepted values must be one:\n\t\t\t*
          \"SUCCESS\"\n\t\t\t* \"FAILURE\"\n\t\t\t* \"ATTENTION\"\n\t\t\t* \"SKIPPED\""
        type: string
      scm:
        allOf:
        - $ref: '#/definitions/result.SCM'
        description: Scm stores scm information
      sourceID:
        description: SourceID stores the source ID used by the target
        type: string
    type: object
  server.AboutResponseModel:
    properties:
      version:
        properties:
          api:
            type: string
          buildTime:
            type: string
          golang:
            type: string
        type: object
    type: object
  server.ConditionConfigResponse:
    properties:
      configs:
        description: Configs is a list of configuration conditions.
        items:
          $ref: '#/definitions/model.ConfigCondition'
        type: array
      total_count:
        description: TotalCount is the total number of conditions for pagination.
        type: integer
    type: object
  server.ConfigKindResponse:
    properties:
      data:
        items:
          type: string
        type: array
    type: object
  server.CreatePipelineReportResponse:
    properties:
      message:
        type: string
      reportid:
        type: string
    type: object
  server.DefaultResponseModel:
    properties:
      error:
        type: string
      message:
        type: string
    type: object
  server.GetPipelineReportByIDResponse:
    properties:
      data:
        $ref: '#/definitions/model.PipelineReport'
      latestReportByID:
        $ref: '#/definitions/model.PipelineReport'
      message:
        type: string
      nbReportsByID:
        type: integer
    type: object
  server.GetPipelineReportsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/database.SearchLatestReportData'
        type: array
      total_count:
        type: integer
    type: object
  server.ListLabelsResponse:
    properties:
      labels:
        description: Labels is a list of labels.
        items:
          $ref: '#/definitions/model.Label'
        type: array
      total_count:
        description: TotalCount is the total number of labels matching the query.
        type: integer
    type: object
  server.ListSCMsResponse:
    properties:
      scms:
        description: SCMs is a list of SCMs.
        items:
          $ref: '#/definitions/model.SCM'
        type: array
      total_count:
        description: TotalCount is the total number of SCMs matching the query.
        type: integer
    type: object
  server.SearchLabelsRequest:
    properties:
      end_time:
        description: |-
          EndTime is the end time for the time range filter
          This is optional and can be used to filter labels by a specific end time
          Time format is RFC3339: 2006-01-02T15:04:05Z07:00
        type: string
      id:
        description: Id is the unique identifier of the label.
        type: string
      key:
        description: Key is the key of the label.
        type: string
      key_only:
        description: KeyOnly specifies if we only need to retrieve a list of uniq
          Label keys
        type: boolean
      limit:
        description: |-
          Limit is the maximum number of labels to return
          This is optional and can be used to limit the number of labels returned
        type: integer
      page:
        description: |-
          Page is the page number for pagination
          This is optional and can be used to paginate the results
        type: integer
      start_time:
        description: |-
          StartTime is the start time for the time range filter
          This is optional and can be used to filter labels by a specific start time
          Time format is RFC3339: 2006-01-02T15:04:05Z07:00
        type: string
      value:
        description: Value is the value of the label.
        type: string
    type: object
  server.SearchPipelineReportsSummaryRequest:
    properties:
      days:
        description: |-
          Days is the number of days to summarize, today included.
          It defaults to 7 and is ignored when hours, or start_time and end_time, are provided.
        type: integer
      end_time:
        description: |-
          EndTime is the end time for the time range filter.
          Time format is: 2006-01-02 15:04:05Z07:00
        type: string
      granularity:
        description: |-
          Granularity is the size of the time buckets, one of "hour", "day", "week" or
          "month". It defaults to "day".
        type: string
      hours:
        description: |-
          Hours is the number of hours to summarize, the current hour included.
          It cannot be combined with days and is ignored when start_time and end_time are provided.
        type: integer
      labels:
        additionalProperties:
          type: string
        description: Labels is a map of labels to filter reports by.
        type: object
      metric:
        description: |-
          Metric is what the reports are counted by. It defaults to "result", which is
          the only value supported so far.
        type: string
      open_action:
        description: |-
          OpenAction filters reports by whether they carry an action left open, such as a
          pull request still waiting to be merged. This is optional: unset does not filter
          anything out, true only counts the reports with an open action and false only the
          ones without.

          The same breakdown is reported without filtering anything out under the open_actions
          key of every bucket.
        type: boolean
      results:
        description: |-
          Results is a list of pipeline results to filter reports by, such as
          "✔", "✗", "⚠" or "-". A report is counted when its result is any of them.
          An empty list does not filter anything out.
        items:
          type: string
        type: array
      scmid:
        description: |-
          ScmID is the ID of the SCM to filter reports by.
          Use "none" to only count the reports which are not attached to any SCM.
        type: string
      start_time:
        description: |-
          StartTime is the start time for the time range filter.
          Time format is: 2006-01-02 15:04:05Z07:00
        type: string
    type: object
  server.SearchPipelineReportsSummaryResponse:
    properties:
      data:
        description: Data contains one entry per time bucket, ordered from the oldest
          to the most recent one.
        items:
          $ref: '#/definitions/database.ReportResultSummaryEntry'
        type: array
      granularity:
        description: Granularity is the size of the time buckets of the entries.
        type: string
      metric:
        description: Metric is the metric the reports were counted by.
        type: string
      total_count:
        description: TotalCount is the total number of reports matching the query.
        type: integer
    type: object
  server.SearchSCMsRequest:
    properties:
      branch:
        description: Branch is the SCM branch to filter by.
        type: string
      end_time:
        description: |-
          EndTime is the end time for the time range filter.
          Time format is RFC3339: 2006-01-02T15:04:05Z07:00
        type: string
      labels:
        additionalProperties:
          type: string
        description: Labels filters SCM summaries by report labels.
        type: object
      limit:
        description: Limit is the maximum number of SCMs to return.
        type: integer
      open_action:
        description: |-
          OpenAction filters SCM summaries by whether a pipeline carries an action left open,
          such as a pull request still waiting to be merged. This is optional: unset does not
          filter anything out, true only keeps the pipelines with an open action and false only
          the ones without.
        type: boolean
      page:
        description: Page is the page number for pagination.
        type: integer
      results:
        description: |-
          Results filters SCM summaries by pipeline result, such as "✔", "✗", "⚠" or
          "-". An empty list does not filter anything out.
        items:
          type: string
        type: array
      scmid:
        description: ScmID is the ID of the SCM to filter by.
        type: string
      start_time:
        description: |-
          StartTime is the start time for the time range filter.
          Time format is RFC3339: 2006-01-02T15:04:05Z07:00
        type: string
      summary:
        description: Summary indicates if the response should contain SCM summary
          data.
        type: boolean
      url:
        description: URL is the SCM URL to filter by.
        type: string
    type: object
  server.SourceConfigResponse:
    properties:
      configs:
        description: Configs is a list of configuration sources.
        items:
          $ref: '#/definitions/model.ConfigSource'
        type: array
      total_count:
        description: TotalCount is the total number of sources for pagination.
        type: integer
    type: object
  server.TargetConfigResponse:
    properties:
      configs:
        description: Configs is a list of configuration targets.
        items:
          $ref: '#/definitions/model.ConfigTarget'
        type: array
      total_count:
        description: TotalCount is the total number of targets for pagination.
        type: integer
    type: object
  source.Config:
    properties:
      dependsOn:
        description: |-
          "dependson" allows to specify the order of execution of resources.
          It accepts a list of rules like "(resourceType#)resourceId(:booleanOperator)".

          The resourceType is optional and can be one of "condition", "source" or "target"
          By default the resourceType is the current resource type

          The resourceId is the name of the resource to depend on

          The booleanOperator is optional and can be "AND" or "OR"

          examples:
             dependson:
               * condition#myCondition:and
               * source#mySource

          remarks:
           * The parameters "sourceid" and "conditionsids" affect the order of resource execution.
           * To avoid circular dependencies, the depended resource may need to remove any conditionids or set "disablesourceinput to true".
        items:
          type: string
        type: array
      deprecatedDependsOn:
        description: |-
          !deprecated, please use dependson
          DeprecatedDependsOn is kept for backward compatibility
        items:
          type: string
        type: array
      deprecatedSCMID:
        description: |-
          !deprecated, please use scmid
          DeprecatedSCMID is kept for backward compatibility
        type: string
      kind:
        description: kind specifies the resource kind which defines accepted spec
          value
        type: string
      name:
        description: name specifies the resource name
        type: string
      scmid:
        description: scmid specifies the scm configuration key associated to the current
          resource
        type: string
      spec:
        description: spec specifies parameters for a specific resource kind
      transformers:
        description: transformers defines how the default input value need to be transformed
        items:
          $ref: '#/definitions/transformer.Transformer'
        type: array
    type: object
  target.Config:
    properties:
      dependsOn:
        description: |-
          "dependson" allows to specify the order of execution of resources.
          It accepts a list of rules like "(resourceType#)resourceId(:booleanOperator)".

          The resourceType is optional and can be one of "condition", "source" or "target"
          By default the resourceType is the current resource type

          The resourceId is the name of the resource to depend on

          The booleanOperator is optional and can be "AND" or "OR"

          examples:
             dependson:
               * condition#myCondition:and
               * source#mySource

          remarks:
           * The parameters "sourceid" and "conditionsids" affect the order of resource execution.
           * To avoid circular dependencies, the depended resource may need to remove any conditionids or set "disablesourceinput to true".
        items:
          type: string
        type: array
      dependsOnChange:
        description: |-
          dependsonchange enables the mechanism to check if the dependant target(s) have made a change.
          If the dependant target(s) have not made a change the target will be skipped.

          default:
            false
        type: boolean
      deprecatedConditionIDs:
        description: |-
          ! Deprecated - please use DependsOn with `condition#conditionid` keys

          conditionids specifies the list of conditions to be evaluated before running the target.
          if at least one condition is not met, the target will be skipped.

          default:
            by default, all conditions are evaluated.
        items:
          type: string
        type: array
      deprecatedDependsOn:
        description: |-
          !deprecated, please use dependson
          DeprecatedDependsOn is kept for backward compatibility
        items:
          type: string
        type: array
      deprecatedSCMID:
        description: |-
          !deprecated, please use scmid
          DeprecatedSCMID is kept for backward compatibility
        type: string
      deprecatedSourceID:
        description: '! Deprecated - please use all lowercase `sourceid`'
        type: string
      disableConditions:
        description: |-
          disableconditions disables the mechanism to evaluate all conditions before running the target.

          default:
            false

          remark:
           It's possible to only monitor specific conditions by setting disableconditions to true
           and using DependsOn with `condition#conditionid` keys
        type: boolean
      disableSourceInput:
        description: |-
          disablesourceinput disables the mechanism to retrieve a default value from a source.
          For example, if true, source information like changelog will not be accessible for a github/pullrequest action.

          default:
           false
        type: boolean
      kind:
        description: kind specifies the resource kind which defines accepted spec
          value
        type: string
      name:
        description: name specifies the resource name
        type: string
      scmid:
        description: scmid specifies the scm configuration key associated to the current
          resource
        type: string
      sourceID:
        description: |-
          sourceid specifies where retrieving the default value.

          default:
            if only one source is defined, then sourceid is set to that sourceid.
        type: string
      spec:
        description: spec specifies parameters for a specific resource kind
      transformers:
        description: transformers defines how the default input value need to be transformed
        items:
          $ref: '#/definitions/transformer.Transformer'
        type: array
    type: object
  transformer.FindSubMatch:
    properties:
      captureIndex:
        description: CaptureIndex defines which substring occurrence to retrieve.
          Note also that a value of `0` for `captureIndex` returns all submatches,
          and individual submatch indexes start at `1`.
        type: integer
      capturePattern:
        description: Uses the match group(s) to generate the output using \0, \1,
          \2, etc
        type: string
      deprecatedCaptureIndex:
        type: integer
      pattern:
        description: Pattern defines regular expression to use for retrieving a submatch
        type: string
    type: object
  transformer.JsonMatch:
    properties:
      joinMultipleMatches:
        description: If we find multiple matches, join them by this
        type: string
      key:
        type: string
      multipleMatchSelector:
        description: If we find multiple matches, select the "first" or the "last"
        type: string
      noMatchResult:
        description: If we don't find a match then return the following string or
          the input value
        type: string
    type: object
  transformer.Replacer:
    properties:
      from:
        description: From defines the source value which need to be replaced
        type: string
      to:
        description: To defines the "to what" a "from" value needs to be replaced
        type: string
    type: object
  transformer.Transformer:
    properties:
      addPrefix:
        description: AddPrefix adds a prefix to the transformer input value
        type: string
      addSuffix:
        description: AddSuffix adds a suffix to the transformer input value
        type: string
      deprecatedAddPrefix:
        type: string
      deprecatedAddSuffix:
        type: string
      deprecatedFindSubMatch: {}
      deprecatedSemVerInc:
        type: string
      deprecatedTrimPrefix:
        type: string
      deprecatedTrimSuffix:
        type: string
      find:
        description: Find searches for a specific value if it exists and return false
          if it doesn't
        type: string
      findSubMatch:
        allOf:
        - $ref: '#/definitions/transformer.FindSubMatch'
        description: Find searches for a specific value if it exists then return the
          value using regular expression
      jsonMatch:
        $ref: '#/definitions/transformer.JsonMatch'
      quote:
        description: Quote add quote around the value
        type: boolean
      replacer:
        allOf:
        - $ref: '#/definitions/transformer.Replacer'
        description: Replacer specifies what value needs to be changed and how
      replacers:
        description: Replacers specifies a list of replacer instruction
        items:
          $ref: '#/definitions/transformer.Replacer'
        type: array
      semVerInc:
        description: SemvVerInc specifies a comma separated list semantic versioning
          component that needs to be upgraded.
        type: string
      trimPrefix:
        description: TrimPrefix removes a prefix to the transformer input value
        type: string
      trimSuffix:
        description: TrimSuffix removes the suffix from the transformer input value
        type: string
      unquote:
        description: Unquote remove quotes around the value
        type: boolean
    type: object
